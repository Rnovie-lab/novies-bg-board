// Quality preview shown after a fresh PDF parse, BEFORE committing the import.
// Surfaces signals (sets %, scene count, format-family) so the user can spot
// a bad parse without having to commit and then discard.
function showImportPreviewModal(s){
  const dayCount=s.days?.length||0;
  const sceneCount=(s.days||[]).reduce((n,d)=>n+(d.scenes?.length||0),0);
  const roleCount=(s.days||[]).reduce((n,d)=>n+(d.scenes||[]).reduce((m,sc)=>m+(sc.roles?.length||0),0),0);
  const withSet=(s.days||[]).reduce((n,d)=>n+(d.scenes||[]).filter(sc=>sc.set && sc.set!=='Unknown Set').length,0);
  const setsPct=sceneCount?Math.round(withSet/sceneCount*100):0;
  const formatRaw=(s.metadata&&s.metadata.format)||'unknown';
  const formatFamily=(s.metadata&&s.metadata.format_family)||'unknown';
  const formatDisplay=(s.metadata&&s.metadata.format_display_name)||formatRaw;
  const format=formatDisplay;
  const formatUnknown=formatFamily==='unknown'||formatRaw.endsWith(':unknown')||formatRaw==='unknown';

  const warnings=[];
  if(sceneCount<5) warnings.push(`Only ${sceneCount} scenes detected — most schedules have many more. Parser may have missed the bulk of the document.`);
  if(sceneCount>0 && setsPct<50) warnings.push(`${setsPct}% of scenes have a real set name (${withSet}/${sceneCount}). The rest show "Unknown Set" — usually means the scene-header format wasn't recognized.`);
  if(formatUnknown) warnings.push(`Format family detected as "${format}". Parser is running without format-specific hints — quality may be lower.`);

  const sev=warnings.length>=2?'red':(warnings.length===1?'yellow':'green');
  const sevColor={red:'#e63946',yellow:'#e9c46a',green:'#52b788'}[sev];
  const sevLabel={red:'⚠ Parse looks suspect',yellow:'⚠ Review before committing',green:'✓ Parse looks healthy'}[sev];

  const showLine=(s.show&&s.show.name)?esc(s.show.name)+(s.show.episode?' · Ep '+esc(s.show.episode):''):'(no show name detected)';

  openModal(`
    <div class="modal-title">Review import
      <button class="btn btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <div style="font-size:13px;color:var(--t2);margin-bottom:6px">${showLine}</div>
    <div style="display:inline-block;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;background:${sevColor};color:#fff;margin-bottom:14px">${sevLabel}</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
      <div style="background:var(--bg-el);padding:10px;border-radius:4px;text-align:center">
        <div style="font-size:22px;font-weight:800">${dayCount}</div>
        <div style="font-size:10px;color:var(--tmut);text-transform:uppercase;letter-spacing:0.06em">Days</div>
      </div>
      <div style="background:var(--bg-el);padding:10px;border-radius:4px;text-align:center">
        <div style="font-size:22px;font-weight:800">${sceneCount}</div>
        <div style="font-size:10px;color:var(--tmut);text-transform:uppercase;letter-spacing:0.06em">Scenes</div>
      </div>
      <div style="background:var(--bg-el);padding:10px;border-radius:4px;text-align:center">
        <div style="font-size:22px;font-weight:800">${roleCount}</div>
        <div style="font-size:10px;color:var(--tmut);text-transform:uppercase;letter-spacing:0.06em">BG roles</div>
      </div>
      <div style="background:var(--bg-el);padding:10px;border-radius:4px;text-align:center">
        <div style="font-size:22px;font-weight:800">${setsPct}%</div>
        <div style="font-size:10px;color:var(--tmut);text-transform:uppercase;letter-spacing:0.06em">with set</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--tmut);margin-bottom:14px">Format detected: <code>${esc(format)}</code></div>
    ${warnings.length?`<div style="border-left:3px solid ${sevColor};padding:8px 12px;background:var(--bg-el);border-radius:0 4px 4px 0;margin-bottom:14px">
      ${warnings.map(w=>`<div style="font-size:12px;color:var(--t2);margin-bottom:4px">• ${esc(w)}</div>`).join('')}
    </div>`:''}
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="_confirmImport()">${sev==='red'?'Import anyway':'Import'}</button>
    </div>
  `);
  window._pendingImport=s;
}
function _confirmImport(){
  const s=window._pendingImport;
  if(!s) return;
  delete window._pendingImport;
  closeModal();
  _applyFreshImport(s);
}

function _applyFreshImport(s){
  // Carry over user-configured show fields (contract type, default rates, role,
  // etc.) — the parser ships factory defaults that should not overwrite anything
  // the user has already set up on the Setup tab.
  const prev=state.show||{};
  const merged={...s.show};
  // Preserve fields the user already filled in on Setup. Name and Episode
  // are intentionally included — the PDF parser often returns generic or
  // empty values for these, and overwriting wipes typed-in show info.
  ['name','episode','contractType','sagMin','defaultRates','preparedBy','role','isSeries','showCost'].forEach(k=>{
    if(prev[k]!==undefined && prev[k]!==null && prev[k]!=='') merged[k]=prev[k];
  });
  if(!merged.defaultRates) merged.defaultRates={...DEFAULT_RATES_FACTORY};
  state=s; state.show=merged;
  if(state.show.isSeries===undefined) state.show.isSeries=false;
  if(!Array.isArray(state.boneyard)) state.boneyard=[];
  // Re-tier and re-rate imported roles to match the show's contract settings.
  const defaultTier=merged.contractType==='nonunion'?'nonunion':'sag';
  const dr=merged.defaultRates||{};
  const reTier=(r)=>{
    r.tier=defaultTier;
    const rate=dr[defaultTier];
    if(rate!==undefined&&rate!==null) r.baseRate=rate;
  };
  (state.days||[]).forEach(d=>(d.scenes||[]).forEach(sc=>(sc.roles||[]).forEach(reTier)));
  (state.boneyard||[]).forEach(sc=>(sc.roles||[]).forEach(reTier));
  _saveId=null; _saveName=null;
  save(); currentTab='breakdown'; render(); updateNavInfo();
  showToast(`Imported: ${s.days.length} days`);
}

function _sceneKey(id){ return (id||'').trim().toLowerCase(); }

function computeDiff(current, incoming){
  // Build lookup: sceneKey → {scene, day} for current breakdown
  const curMap={};
  current.days.forEach(day=>{
    (day.scenes||[]).forEach(sc=>{
      curMap[_sceneKey(sc.sceneId)]={scene:sc, day};
    });
  });

  // Build lookup for incoming schedule
  const newMap={};
  incoming.days.forEach(day=>{
    (day.scenes||[]).forEach(sc=>{
      newMap[_sceneKey(sc.sceneId)]={scene:sc, day};
    });
  });

  const added=[], removed=[], moved=[], changed=[], unchanged=[];

  // Check every scene in the incoming schedule
  for(const [key, {scene:nSc, day:nDay}] of Object.entries(newMap)){
    if(!curMap[key]){
      added.push({sceneId:nSc.sceneId, scene:nSc, day:nDay});
    } else {
      const {scene:cSc, day:cDay}=curMap[key];
      const dayMoved = cDay.dayNumber !== nDay.dayNumber;
      const setChanged = (cSc.set||'').trim() !== (nSc.set||'').trim();
      const descChanged = (cSc.desc||'').trim() !== (nSc.desc||'').trim();
      if(dayMoved){
        moved.push({sceneId:nSc.sceneId, scene:nSc, newDay:nDay, oldDay:cDay, curScene:cSc});
      } else if(setChanged||descChanged){
        changed.push({sceneId:nSc.sceneId, scene:nSc, day:nDay, curScene:cSc, setChanged, descChanged, oldSet:cSc.set, oldDesc:cSc.desc});
      } else {
        unchanged.push(nSc.sceneId);
      }
    }
  }

  // Scenes in current that are NOT in the incoming schedule
  for(const [key, {scene:cSc, day:cDay}] of Object.entries(curMap)){
    if(!newMap[key]){
      removed.push({sceneId:cSc.sceneId, scene:cSc, day:cDay});
    }
  }

  return {added, removed, moved, changed, unchanged,
          totalChanges: added.length+removed.length+moved.length+changed.length};
}

function showDiffModal(diff, incoming){
  if(diff.totalChanges===0){
    openModal(`
      <div class="modal-title">📋 No Changes Found</div>
      <p style="color:var(--tfnt);margin:16px 0">The new schedule matches your current breakdown — no scenes were added, removed, or changed.</p>
      <div style="text-align:right"><button class="btn btn-ghost" onclick="closeModal()">OK</button></div>`);
    return;
  }

  const s=incoming.show;
  const showLabel=`${s.name||''}${s.episode?' · Ep '+s.episode:''}`;

  function diffSection(items, type){
    if(!items.length) return '';
    const labels={
      added:'NEW — will be added',
      removed:'DROPPED from schedule',
      moved:'MOVED to different day',
      changed:'LOCATION / DESC CHANGED'
    };
    const color={added:'#2ecc71',removed:'#e74c3c',moved:'#e9c46a',changed:'#3a7bd5'};
    const rows=items.map((item,i)=>{
      const id=`diff-${type}-${i}`;
      const dayLabel=item.day?.date||item.newDay?.date||'';
      const dayNum=item.day?.dayNumber??item.newDay?.dayNumber??'';
      let detail='';
      if(type==='changed'){
        if(item.setChanged) detail+=`<div class="diff-old">was: ${esc(item.oldSet)}</div>`;
        if(item.descChanged) detail+=`<div class="diff-old">desc was: ${esc(item.oldDesc||'—')}</div>`;
        detail+=`<div class="diff-note">Your BG roles, bumps & notes are preserved</div>`;
      }
      if(type==='moved'){
        detail+=`<div class="diff-old">was: Day ${item.oldDay.dayNumber} (${item.oldDay.date||''})</div>`;
      }
      if(type==='removed'){
        detail+=`<div class="diff-note">Uncheck to keep in your breakdown</div>`;
      }
      return `<label class="diff-row" for="${id}">
        <input type="checkbox" id="${id}" data-diff-type="${type}" data-diff-idx="${i}" checked onchange="updateDiffCount()">
        <div class="diff-row-body">
          <div class="diff-row-title">Sc ${esc(item.sceneId)} &nbsp;<span style="color:var(--tfnt);font-weight:400">${esc(item.scene?.set||item.curScene?.set||'')}</span> <span class="diff-day-badge">Day ${dayNum}${dayLabel?' · '+dayLabel:''}</span></div>
          ${detail}
        </div>
      </label>`;
    }).join('');

    return `<div class="diff-section">
      <div class="diff-section-hdr" style="color:${color[type]}">${labels[type]} (${items.length})</div>
      ${rows}
    </div>`;
  }

  const unchangedNote=diff.unchanged.length
    ?`<div class="diff-unchanged">${diff.unchanged.length} scene${diff.unchanged.length!==1?'s':''} unchanged — your data fully preserved</div>`:'';

  const html=`
    <div class="modal-title">📋 New Draft — Review Changes</div>
    <div style="font-size:12px;color:var(--tvfnt);margin-bottom:14px">${esc(showLabel)} &nbsp;·&nbsp; ${incoming.days.length} days &nbsp;·&nbsp; ${(incoming.days||[]).reduce((n,d)=>n+(d.scenes?.length||0),0)} scenes</div>
    <div class="diff-list" id="diff-list">
      ${diffSection(diff.added,'added')}
      ${diffSection(diff.removed,'removed')}
      ${diffSection(diff.moved,'moved')}
      ${diffSection(diff.changed,'changed')}
      ${unchangedNote}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
      <button class="btn btn-danger" onclick="closeModal()">Cancel — keep current</button>
      <button class="btn btn-primary" id="diff-apply-btn" onclick="applyDiff(diffPayload)">Apply <span id="diff-count">${diff.totalChanges}</span> Changes</button>
    </div>`;

  // Store diff+incoming for the apply function
  window.diffPayload={diff, incoming};
  openModal(html);
}

function updateDiffCount(){
  const checked=document.querySelectorAll('#diff-list input[type=checkbox]:checked').length;
  const btn=document.getElementById('diff-apply-btn');
  const cnt=document.getElementById('diff-count');
  if(cnt) cnt.textContent=checked;
  if(btn) btn.disabled=checked===0;
}

function applyDiff({diff, incoming}){
  // Deep clone current state as base
  const next=JSON.parse(JSON.stringify(state));

  // Collect which items are checked by type+index
  function isChecked(type, idx){
    const el=document.getElementById(`diff-${type}-${idx}`);
    return el?el.checked:true;
  }

  // Helper: find or create a day in next by dayNumber
  function findOrCreateDay(dayNumber, templateDay){
    let d=next.days.find(x=>x.dayNumber===dayNumber);
    if(!d){
      d={id:uid(), dayNumber, date:templateDay.date||'', scenes:[], standinOff:{}, standinHours:{}};
      next.days.push(d);
      next.days.sort((a,b)=>a.dayNumber-b.dayNumber);
    }
    return d;
  }

  // ADDED: insert new scenes (with their imported roles)
  diff.added.forEach((item,i)=>{
    if(!isChecked('added',i)) return;
    const day=findOrCreateDay(item.day.dayNumber, item.day);
    day.scenes.push(JSON.parse(JSON.stringify(item.scene)));
  });

  // REMOVED: delete scenes from current state
  diff.removed.forEach((item,i)=>{
    if(!isChecked('removed',i)) return;
    const key=_sceneKey(item.sceneId);
    next.days.forEach(d=>{ d.scenes=d.scenes.filter(sc=>_sceneKey(sc.sceneId)!==key); });
  });

  // MOVED: move scene to new day (keep existing roles/notes)
  diff.moved.forEach((item,i)=>{
    if(!isChecked('moved',i)) return;
    const key=_sceneKey(item.sceneId);
    let movedScene=null;
    // Remove from old day
    next.days.forEach(d=>{
      const idx=d.scenes.findIndex(sc=>_sceneKey(sc.sceneId)===key);
      if(idx>=0){ movedScene=d.scenes.splice(idx,1)[0]; }
    });
    if(movedScene){
      movedScene.set=item.scene.set; // update location too
      const newDay=findOrCreateDay(item.newDay.dayNumber, item.newDay);
      newDay.scenes.push(movedScene);
    }
  });

  // CHANGED: update set/desc only — keep all roles, bumps, notes intact
  diff.changed.forEach((item,i)=>{
    if(!isChecked('changed',i)) return;
    const key=_sceneKey(item.sceneId);
    next.days.forEach(d=>{
      const sc=d.scenes.find(s=>_sceneKey(s.sceneId)===key);
      if(sc){
        if(item.setChanged) sc.set=item.scene.set;
        if(item.descChanged) sc.desc=item.scene.desc;
      }
    });
  });

  // Update show info (name/episode from new draft), keep user settings
  next.show.name=incoming.show.name||next.show.name;
  next.show.episode=incoming.show.episode||next.show.episode;

  // Remove empty days (no scenes left after removals)
  next.days=next.days.filter(d=>d.scenes.length>0);

  state=next;
  _saveId=null; _saveName=null; // mark as unsaved after merge
  save(); closeModal(); currentTab='breakdown'; render(); updateNavInfo();
  showToast('Merge applied — breakdown updated');
}

async function importPDF(e){
  const f=e.target.files[0];
  e.target.value='';
  if(!f) return;

  _pdfServerAvailable=null;
  const ok=await checkPdfServer();
  if(!ok){
    alert(
      'PDF import requires the local server.\n\n'+
      'In Terminal, cd into your BG Board folder and run:\n\n'+
      '    python3 bgboard_server.py\n\n'+
      'Then use the app at http://localhost:8765'
    );
    return;
  }

  // Show spinner
  const btn=document.getElementById('pdf-import-btn');
  const lbl=document.getElementById('pdf-import-label');
  const orig=lbl.textContent;
  lbl.textContent='Parsing… (may take ~1 min for large PDFs)';
  btn.style.pointerEvents='none';

  try{
    // Always use the universal parser (/parse-pdf) — it handles all known
    // schedule formats (Movie Magic, EP Scheduling, 1-Line, Shamelab, OCR).
    // Fall back to the legacy /parse-schedule endpoint only if /parse-pdf
    // is completely unavailable (network error / 404).
    let res, data, endpoint;

    try{
      endpoint=PDF_ENDPOINT;
      res=await fetchWithTimeout(endpoint,{
        method:'POST',
        headers:{'Content-Type':'application/pdf'},
        body:f
      },300000);  // 5 min — OCR on large PDFs can take 90+ seconds
      try{ data=await res.json(); }
      catch(je){ throw new Error('Server returned non-JSON response (status '+res.status+')'); }
    }catch(e1){
      // Fall back to legacy endpoint if universal parser not reachable
      endpoint=SCHEDULE_ENDPOINT;
      res=await fetchWithTimeout(endpoint,{
        method:'POST',
        headers:{'Content-Type':'application/pdf'},
        body:f
      },60000);
      try{ data=await res.json(); }
      catch(je){ throw new Error('Server returned non-JSON response (status '+res.status+')'); }
    }

    if(!res.ok||!data.ok){
      alert('Parse error: '+(data.error||'Unknown error'));
      return;
    }
    const s=data.state;
    const dayCount=s.days?.length||0;
    const sceneCount=(s.days||[]).reduce((n,d)=>n+(d.scenes?.length||0),0);
    const roleCount=(s.days||[]).reduce((n,d)=>n+(d.scenes||[]).reduce((m,sc)=>m+(sc.roles?.length||0),0),0);

    if(state.days.length===0){
      // Fresh import — show quality preview so the user can spot bad parses
      // before committing. Existing breakdowns still go through the diff
      // flow which has its own review step.
      showImportPreviewModal(s);
    } else {
      // Existing breakdown — run diff, let user review
      showDiffModal(computeDiff(state, s), s);
    }
  }catch(err){
    alert('PDF import failed: '+err.message);
  }finally{
    lbl.textContent=orig;
    btn.style.pointerEvents='';
  }
}

function resetAll(){
  const savedHint=_saveName
    ? `\n\nThis won't delete the saved project "${_saveName}" — that copy is on disk.`
    : (_hasSubstance()
        ? `\n\nThis board is NOT saved. To keep it, click Cancel and use 📂 Projects → "New Episode" instead (auto-saves first).`
        : '');
  if(!confirm('Delete the current in-progress board?'+savedHint))return;
  state=defaultState();_saveId=null;_saveName=null;expandedDays={};
  // Visually clear the current view BEFORE rendering the new one. This
  // gives the user immediate feedback that Discard took effect, even on
  // the same tab they were viewing. Without this, the prior breakdown
  // HTML stayed visible until the user manually switched tabs.
  const main=document.getElementById('main');
  if(main) main.innerHTML='';
  if(typeof closeModal==='function') closeModal();
  currentTab='setup';
  save();
  render();
}

async function incrementUsage(){
  if(sessionStorage.getItem('bg_counted')) return; // already counted this session
  sessionStorage.setItem('bg_counted','1');
  try{
    const res=await fetch('/usage/increment',{method:'POST'});
    const j=await res.json();
    state._usageCount=j.count;
    // Re-render setup tab if it's active so counter appears immediately
    if(currentTab==='setup') render();
    else{
      const el=document.getElementById('usage-counter');
      if(el) el.textContent=`sessions: ${j.count}`;
    }
  }catch(e){/* server not running or Railway — silent fail */}
}

// ══════════════════════════════════════════════════════════
// AUTH (Clerk) + INIT
// ══════════════════════════════════════════════════════════
// Bootstrap flow:
//   1. Fetch /config to get the Clerk publishable key (if any)
//   2. If a key is present, load Clerk SDK, init, require sign-in
//   3. If no key (local dev), skip auth and run as before
// All fetches to /saves* are wrapped to inject a Bearer token automatically.

// Fetch wrapper: attach Authorization header to protected endpoints and
// auto-prompt sign-in on 401. Defined before init so existing fetch() calls
// are intercepted transparently.
const _origFetch = window.fetch.bind(window);
window.fetch = async function(url, opts={}){
  const u = String(url);
  const isProtected = /^\/?(saves)(\b|\/)/.test(u);
  if(isProtected && window.__clerk && window.__clerk.session){
    try{
      const token = await window.__clerk.session.getToken();
      if(token){
        opts.headers = Object.assign({}, opts.headers||{}, {'Authorization':'Bearer '+token});
      }
    }catch(e){/* fall through — server will 401 if needed */}
  }
  const res = await _origFetch(url, opts);
  if(isProtected && res.status === 401 && window.__clerk){
    window.__clerk.openSignIn();
  }
  return res;
};

async function bootstrap(){
  // Wire up tab buttons + theme (these are pre-auth concerns)
  document.querySelectorAll('.nav-tab').forEach(t=>{
    t.addEventListener('click',()=>{currentTab=t.dataset.tab;render();});
  });
  initTheme();
  incrementUsage();

  // Read public config from server
  let cfg = {};
  try{ cfg = await (await _origFetch('/config')).json(); }
  catch(e){ console.warn('Could not load /config — running without auth', e); }

  const pk = cfg.clerkPublishableKey;
  if(!pk){
    // No Clerk configured (local dev) — render immediately, no auth
    render();
    return;
  }

  // Dynamic-load the Clerk JS SDK from the tenant's frontend-API domain.
  // Using clerk.browser.js (auto-init variant): we pass the publishable key
  // via the data-clerk-publishable-key attribute, and after load Clerk
  // exposes itself on window.Clerk as a ready-to-use INSTANCE (not a
  // constructor). Domain is base64-encoded in the publishable key after
  // the second '_'.
  const clerkDomain = atob(pk.split('_')[2]).replace(/\$+$/,'');
  await new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=`https://${clerkDomain}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js`;
    s.async=true; s.crossOrigin='anonymous';
    s.setAttribute('data-clerk-publishable-key', pk);
    s.onload=resolve;
    s.onerror=()=>reject(new Error('Clerk SDK failed to load — check Clerk domain in publishable key'));
    document.head.appendChild(s);
  });

  // Auto-init exposes window.Clerk as an instance. Await load() to ensure
  // it's hydrated before we read clerk.user / clerk.session.
  const clerk = window.Clerk;
  await clerk.load();
  window.__clerk = clerk;

  // Mount Clerk's UserButton (avatar + sign-out dropdown) into the nav
  const userBtnEl = document.getElementById('clerk-user-btn');
  if(userBtnEl && clerk.user){
    clerk.mountUserButton(userBtnEl);
  }

  // Re-mount + re-render whenever auth state changes (sign in / sign out)
  clerk.addListener(({user})=>{
    if(user && userBtnEl){
      userBtnEl.innerHTML = '';
      clerk.mountUserButton(userBtnEl);
    }
    if(!user){
      // Signed out — clear local state and prompt sign-in
      state = defaultState();
      save();
      clerk.openSignIn();
    } else {
      render();
    }
  });

  if(!clerk.user){
    clerk.openSignIn();
  } else {
    render();
  }
}

bootstrap();
