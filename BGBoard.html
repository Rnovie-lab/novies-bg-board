<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novie's BG Board</title>
<style>
:root{
  --bg-page:#22232b;--bg-nav:#14151b;--bg-card:#2a2c36;--bg-el:#1a1c24;
  --bg-sun:#0e0f13;--bg-inp:#181920;--bg-hov:#1e1f28;--bg-th:#1e2028;
  --bg-sh:#22242e;--bg-si:#181e2c;--bg-ct:#0a1018;--bg-pd:#0a0f20;
  --bg-ps:#0a1628;--bg-psc:#1a2a3e;--bg-sid:#0e1824;--bg-bt:#151720;
  --bg-rt:#0e2018;--bg-rh:#1e2840;--bg-ra:rgba(255,255,255,0.022);
  --bg-bs:#252838;--bg-bsh:#303348;--bg-dn:#220e0e;--bg-dnh:#3a1a1a;
  --bg-bsag:#141e2e;--bg-bnu:#1e1230;--bg-bsi:#121e18;--bg-bdr:#26200e;
  --bg-bcu:#222;--bg-sw:#220808;--bg-so:#091a10;--bg-ds:#1a1c24;
  --bg-gd:#0a0f20;--bg-bdsi:#0e1a14;--bg-modal:#2a2c36;
  --br:#33354a;--br2:#252838;--br3:#4a4d66;--br4:#2a2a4a;
  --br5:#1a1c24;--br6:#22242e;--br7:#1a2a3a;--br8:#1a3a5a;
  --br9:#0f1520;--brp:#2a2c3a;--brb:#131a2e;--brd:#2a2a4a;
  --t1:#e0e0e0;--t2:#d0d0d0;--t3:#ccc;--t4:#bbb;
  --tlbl:#aaa;--tmut:#999;--tfnt:#888;--tvfnt:#778;--tph:#42445a;
}
[data-theme="light"]{
  --bg-page:#f0f2f7;--bg-nav:#ffffff;--bg-card:#ffffff;--bg-el:#f5f6fa;
  --bg-sun:#eceef5;--bg-inp:#f8f9fb;--bg-hov:#eef0f8;--bg-th:#f0f2f8;
  --bg-sh:#e8eaf2;--bg-si:#e8f0f8;--bg-ct:#e8f2f8;--bg-pd:#f0f4f8;
  --bg-ps:#e8f0f8;--bg-psc:#dde8f0;--bg-sid:#e0e8f0;--bg-bt:#eaecf4;
  --bg-rt:#e0f0ea;--bg-rh:#dde8f4;--bg-ra:rgba(0,0,0,0.025);
  --bg-bs:#e8eaf2;--bg-bsh:#dddff0;--bg-dn:#fde8e8;--bg-dnh:#fad0d0;
  --bg-bsag:#dce8f4;--bg-bnu:#f0e8fa;--bg-bsi:#e0f0ea;--bg-bdr:#f4f0de;
  --bg-bcu:#f0f0f0;--bg-sw:#fde8e8;--bg-so:#e0f0ea;--bg-ds:#f5f6fa;
  --bg-gd:#f0f4f8;--bg-bdsi:#ddf0e4;--bg-modal:#ffffff;
  --br:#c8ccdc;--br2:#d0d4e4;--br3:#b0b8d0;--br4:#c0c8dc;
  --br5:#e0e4f0;--br6:#d0d4e4;--br7:#c0c8dc;--br8:#90aac4;
  --br9:#d0d4e4;--brp:#c8ccdc;--brb:#c8d0e4;--brd:#d0d4e4;
  --t1:#1a1a2e;--t2:#252535;--t3:#353545;--t4:#3a3a5a;
  --tlbl:#3a3a55;--tmut:#555570;--tfnt:#606070;--tvfnt:#707080;--tph:#aab0cc;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:var(--bg-page);color:var(--t1);min-height:100vh;font-size:14px}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input,select,textarea{outline:none;font-family:inherit;font-size:14px}

/* NAV */
#nav{background:var(--bg-nav);border-bottom:2px solid #2a7fc4;display:flex;align-items:center;padding:0 28px;height:78px;gap:0;position:sticky;top:0;z-index:50}
.nav-brand{display:flex;align-items:center;margin-right:16px;flex-shrink:0}
.nav-tabs{display:flex;gap:2px;flex:1}
.nav-tab{padding:8px 16px;border-radius:4px;font-size:12px;font-weight:700;color:var(--tmut);background:transparent;letter-spacing:0.8px;text-transform:uppercase;border:none;cursor:pointer;transition:color 0.15s}
.nav-tab:hover{color:var(--t3);background:var(--bg-hov)}
.nav-tab.active{color:#2a7fc4;background:var(--bg-hov)}
.nav-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.nav-show-info{font-size:12px;color:var(--tmut);text-align:right;margin-left:14px}

/* LAYOUT */
#main{padding:24px 28px 80px;max-width:1300px;margin:0 auto}

/* CARDS */
.card{background:var(--bg-card);border:1px solid var(--br);border-radius:8px;padding:20px;margin-bottom:18px}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tfnt);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.accent{color:#2a7fc4}

/* FORM */
.fg{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
.form-group{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--tlbl)}
.inp{background:var(--bg-inp);border:1px solid var(--br);border-radius:4px;padding:8px 11px;color:var(--t1);width:100%;transition:border-color 0.15s}
.inp:focus{border-color:#2a7fc4}
.inp::placeholder{color:var(--tph)}
.sel{background:var(--bg-inp);border:1px solid var(--br);border-radius:4px;padding:8px 11px;color:var(--t1);cursor:pointer;width:100%}
.hint{font-size:11px;color:var(--tmut);margin-top:3px;line-height:1.4}
.setup-card{border-color:var(--br)!important}

/* BUTTONS */
.btn{padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;cursor:pointer;font-family:inherit;transition:background 0.12s,border-color 0.12s,color 0.12s}
.btn-primary{background:#2a7fc4;color:#fff;border-color:#2a7fc4}.btn-primary:hover{background:#1a6ab0;border-color:#1a6ab0}
.btn-secondary{background:var(--bg-card);color:var(--t2);border-color:var(--br)}.btn-secondary:hover{background:var(--bg-bsh);color:var(--t1);border-color:var(--br3)}
.btn-success{background:#2d7a50;color:#fff;border-color:#2d7a50}.btn-success:hover{background:#247042;border-color:#247042}
.btn-ghost{background:transparent;color:var(--tmut);padding:7px 10px;border-color:transparent}.btn-ghost:hover{color:var(--t3);background:var(--bg-el)}
.btn-danger{background:var(--bg-dn);color:#e63946;border-color:var(--bg-dnh)}.btn-danger:hover{background:var(--bg-dnh);border-color:#e63946}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px}.btn-xs{padding:4px 8px;font-size:11px;border-radius:6px}

/* STANDINS ROSTER */
.si-item{background:var(--bg-sun);border:1px solid var(--br2);border-radius:6px;padding:11px 14px;display:flex;align-items:center;gap:14px;margin-bottom:8px}
.si-name{font-weight:700;color:var(--t1);min-width:160px}

/* CONTRACT INFO BOX */
.contract-box{background:var(--bg-ct);border:1px solid var(--br8);border-radius:6px;padding:12px 14px;margin-top:12px}
.contract-box .rule{font-size:12px;color:var(--tfnt);line-height:1.7}
.contract-box .rule strong{color:#457b9d}

/* DAY BLOCKS */
.day-block{background:var(--bg-card);border:1px solid var(--br3);border-radius:8px;margin-bottom:20px;overflow:hidden}
.day-hdr{background:linear-gradient(to right,#1d4068,#182848);border-left:5px solid #3a90d4;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.day-hdr-left{display:flex;align-items:center;gap:12px}
.day-label{font-size:15px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:1.2px}
.day-date-str{font-size:12px;color:rgba(255,255,255,0.7);font-weight:400}
.day-date-edit{position:relative;display:inline-flex;align-items:center;font-size:12px;color:rgba(255,255,255,0.75);font-weight:400;cursor:pointer;padding:2px 6px;border-radius:3px;border:1px dashed transparent;transition:background 0.12s,border-color 0.12s}
.day-date-edit:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.25);color:rgba(255,255,255,0.95)}
.day-date-edit.empty{color:rgba(255,255,255,0.5);font-style:italic;border-color:rgba(255,255,255,0.15)}
.day-date-edit input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;color-scheme:dark}
.bd-totals-strip{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:12px 18px;background:var(--bg-el);border:2px solid #2a7fc4;border-radius:6px;margin-top:16px;margin-bottom:14px}
.bd-totals-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tlbl);padding-right:8px;border-right:1px solid var(--brd)}
.bd-tot{display:flex;align-items:baseline;gap:6px;font-size:13px}
.bd-tot strong{font-size:18px;font-weight:800}
.bd-tot-lbl{font-size:10px;color:var(--tmut);text-transform:uppercase;letter-spacing:0.5px}
.bd-tot-cost{margin-left:auto}
.bd-totals-toggle{margin-left:8px;background:transparent;border:1px solid var(--brd);color:var(--tmut);width:24px;height:24px;border-radius:3px;cursor:pointer;font-size:14px;line-height:1;padding:0}
.bd-totals-toggle:hover{color:var(--t1);border-color:#2a7fc4}
.day-stats{display:flex;gap:18px;align-items:center}
.day-stat{font-size:11px;color:rgba(255,255,255,0.65);font-weight:600;letter-spacing:0.3px}
.day-stat strong{color:#fff;font-size:13px}
.day-stat-sag{font-size:11px;color:rgba(255,255,255,0.75);font-weight:700;letter-spacing:0.3px}
.day-stat-sag strong{color:#7cc4f0;font-size:16px;font-weight:900}
.day-body{padding:16px;display:none}
.day-body.open{display:block}

/* STAND-INS IN DAY */
.si-section{background:var(--bg-si);border-left:3px solid #457b9d;border-radius:0 4px 4px 0;padding:6px 14px;margin-top:10px}
.si-section-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#457b9d;margin-bottom:4px}
.si-day-row{display:grid;grid-template-columns:160px 1fr 80px 90px 60px;gap:8px;align-items:center;padding:1px 0;border-bottom:1px solid var(--br9)}
.si-day-row:last-child{border-bottom:none}
.si-day-name{font-size:11px;font-weight:600;color:var(--t3)}
.si-day-char{font-size:10px;color:var(--tfnt)}
.si-hrs-input{width:52px;background:var(--bg-sh);border:1px solid var(--br);border-radius:3px;padding:1px 6px;color:var(--t1);font-size:11px;text-align:center}
.si-hrs-input:disabled{opacity:0.3}
.si-off-toggle{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--tmut);cursor:pointer;user-select:none}
.si-off-toggle input{accent-color:#2a7fc4;cursor:pointer;width:12px;height:12px}
.si-working{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px}
.si-working.on{color:#52b788}.si-working.off{color:var(--tvfnt)}

/* SCENE */
.scene-block{margin-bottom:10px;border-left:3px solid var(--br2);padding-left:0;border-radius:0 0 0 0}
.scene-id{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#3a6ea8;background:var(--bg-sid);padding:2px 7px;border-radius:3px}
.scene-set{font-size:13px;font-weight:700;color:var(--t2)}
.scene-desc{font-size:11px;color:var(--tmut)}
/* scene header spans full width — badge + set stack via flex-wrap */
tr.scene-hdr-row>td{background:var(--bg-sh);padding:3px 6px;vertical-align:middle}
tr.scene-hdr-row>.shdr-main{padding-left:12px;padding-right:6px}
.shdr-inner{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.shdr-inner .scene-set{flex:1;min-width:120px;word-break:break-word}
tr.scene-hdr-row>.shdr-btns{text-align:right;white-space:nowrap;padding-right:10px}

/* ROLES TABLE */
.roles-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;margin-bottom:0}
.roles-table colgroup .col-edit{width:36px}
.roles-table colgroup .col-count{width:44px}
.roles-table colgroup .col-type{width:28%}
.roles-table tbody tr td:nth-child(3){font-size:11px;font-weight:400}
.roles-table colgroup .col-tier{width:72px}
.roles-table colgroup .col-rate{width:72px}
.roles-table colgroup .col-hours{width:72px}
.roles-table colgroup .col-bumps{width:90px}
.roles-table colgroup .col-notes{width:90px}
.roles-table colgroup .col-reuse{width:auto}
.roles-table th{text-align:left;padding:4px 9px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--tlbl);border-bottom:1px solid var(--br6);background:var(--bg-th)}
.roles-table td{padding:4px 9px;border-bottom:1px solid var(--br5);vertical-align:middle}
.roles-table tbody tr{cursor:pointer;transition:background 0.1s}
.roles-table tbody tr:nth-child(even) td{background:var(--bg-ra)}
.roles-table tbody tr:hover td{background:var(--bg-rh)!important}
.roles-table tr:last-child td{border-bottom:none}
.edit-icon{display:inline-block;color:var(--tvfnt);font-size:13px;transition:color 0.1s;padding:0 2px}
.roles-table tbody tr:hover .edit-icon{color:#5ba4e0}
tr.no-roles-row{cursor:pointer}
tr.no-roles-row:hover td{color:var(--tlbl)!important;background:var(--bg-th)!important}

/* BADGES */
.badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:3px;letter-spacing:0.4px}
.badge-sag{background:var(--bg-bsag);color:#457b9d}
.badge-sag_hi{background:var(--bg-bsag);color:#6ca0c8}
.badge-nonunion{background:var(--bg-bnu);color:#9b72cf}
.badge-standin{background:var(--bg-bsi);color:#52b788}
.badge-driver{background:var(--bg-bdr);color:#e9c46a}
.badge-custom{background:var(--bg-bcu);color:var(--tlbl)}
.badge-minor{background:var(--bg-bdr);color:#e9c46a;font-size:10px}

/* BUMP TAGS + REUSE */
.bump-tags{display:flex;flex-wrap:wrap;gap:3px}
.bump-tag{background:var(--bg-bt);color:var(--tfnt);font-size:10px;padding:2px 6px;border-radius:3px;border:1px solid var(--br2)}
.reuse-tag{background:var(--bg-rt);color:#3d9e6a;font-size:10px;padding:2px 8px;border-radius:3px;font-weight:700;letter-spacing:0.2px;display:inline-block;text-align:left}
.reuse-tag-auto{background:transparent;color:var(--tmut);border:1px dashed var(--br);font-weight:600}
.ot-warn{font-size:10px;color:#e63946;font-weight:700;margin-left:4px}

/* TOTALS BAR */
.totals-bar{background:var(--bg-el);border-top:1px solid var(--br);border-radius:0 0 6px 6px;padding:10px 14px;display:flex;align-items:center;gap:20px;margin-top:0;flex-wrap:wrap}
.total-item{display:flex;align-items:center;gap:5px}
.total-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--tlbl)}
.total-val{font-size:13px;font-weight:700;color:var(--t1)}
.total-val.red{color:#2a7fc4}.total-val.blue{color:#457b9d}.total-val.green{color:#52b788}.total-val.purple{color:#9b72cf}
.sag-warning{font-size:11px;font-weight:700;color:#e63946;background:var(--bg-sw);padding:3px 9px;border-radius:3px;margin-left:auto}
.sag-ok{font-size:11px;font-weight:700;color:#3d9e6a;background:var(--bg-so);padding:3px 9px;border-radius:3px;margin-left:auto}

/* BUMP SELECTOR IN MODAL */
.bump-select-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.bump-list{border:1px solid var(--br4);border-radius:5px;overflow:hidden;margin-top:4px}
.bump-list-item{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--brb);font-size:12px}
.bump-list-item:last-child{border-bottom:none}
.bump-list-label{flex:1;color:var(--t3)}
.bump-list-amt{color:#52b788;font-weight:700;min-width:50px;text-align:right}
.bump-empty{font-size:12px;color:var(--tfnt);padding:8px 0}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
#modal-overlay.open{display:flex}
.modal-box{background:var(--bg-modal);border:1px solid var(--br);border-radius:10px;width:100%;max-width:660px;max-height:92vh;overflow-y:auto;padding:22px}
.modal-title{font-size:17px;font-weight:800;color:var(--t1);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}

/* PRINT / EXPORT */
.print-hdr-block{text-align:center;margin-bottom:18px}
.print-show-title{font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:2px;border-bottom:3px solid #2a7fc4;padding-bottom:8px;margin-bottom:6px}
.print-meta{font-size:13px;color:var(--tfnt);margin-bottom:3px}
.print-legend{font-size:11px;color:var(--tmut);font-style:italic;margin-top:6px}
.print-day{margin-bottom:28px}
.print-day-hdr{background:#2a7fc4;color:#fff;padding:7px 14px;font-weight:900;font-size:14px;display:flex;justify-content:space-between;border-radius:4px 4px 0 0}
.print-table{width:100%;border-collapse:collapse;font-size:12px}
.print-table th{background:var(--bg-pd);padding:6px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--tmut);border:1px solid var(--br7)}
.print-table td{padding:6px 10px;border:1px solid var(--br7);vertical-align:middle}
.print-table .row-si td{background:var(--bg-ps);color:#457b9d;font-style:italic}
.print-table .row-scene-hdr td{background:var(--bg-psc);color:var(--tmut);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px}
.print-totals{background:var(--bg-gd);padding:8px 14px;display:flex;gap:24px;font-size:13px;font-weight:700;border:1px solid var(--br4);border-top:none;border-radius:0 0 4px 4px;flex-wrap:wrap}
.grand-totals{background:var(--bg-gd);border:2px solid #2a7fc4;border-radius:6px;padding:16px 20px;margin-top:16px}
.grand-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;margin-bottom:14px}
.grand-item .glbl{font-size:10px;color:var(--tmut);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:2px}
.grand-item .gval{font-size:24px;font-weight:900}
.empty{text-align:center;padding:36px 20px;color:var(--tfnt);font-size:13px}
.empty-icon{font-size:34px;margin-bottom:10px}

/* CHECKBOX STYLE */
.cb-row{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px;color:var(--t3)}
.cb-row input[type=checkbox]{accent-color:#2a7fc4;width:15px;height:15px;cursor:pointer;flex-shrink:0}

/* DIVIDER */
.divider{border:none;border-top:1px solid var(--brd);margin:14px 0}

@media print{
  #nav,.print-hide,button{display:none!important}
  body{background:#fff;color:#000}
  .print-show-title{color:#000;border-bottom-color:#000}
  .print-day-hdr{background:#000!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-table th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#000;border-color:#999}
  .print-table td{border-color:#ccc;color:#000}
  .print-table .row-si td{background:#e8f4ff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#003366}
  .print-table .row-scene-hdr td{background:#f5f5f5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#333}
  .print-totals,.grand-totals{background:#f9f9f9!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#000;border-color:#999}
  #main{padding:0;max-width:100%}
  .print-day{page-break-inside:avoid}
}
/* ── Saves list ─────────────────────────────────────────── */
.saves-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto}
.save-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--bg-el);border-radius:6px;border:1px solid var(--br2)}
.save-row-info{flex:1;min-width:0}
.save-row-name{font-size:13px;font-weight:700;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-row-meta{font-size:11px;color:var(--tmut);margin-top:2px}
.save-row-actions{display:flex;gap:6px;flex-shrink:0}
/* ── Diff modal ─────────────────────────────────────────── */
.diff-list{max-height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.diff-section{display:flex;flex-direction:column;gap:4px}
.diff-section-hdr{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 0 6px;border-bottom:1px solid var(--br2);margin-bottom:4px}
.diff-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;background:var(--bg-ds);border-radius:5px;cursor:pointer;border:1px solid transparent}
.diff-row:hover{border-color:var(--brp)}
.diff-row input[type=checkbox]{margin-top:2px;flex-shrink:0;width:15px;height:15px;accent-color:#3a7bd5}
.diff-row-body{flex:1;min-width:0}
.diff-row-title{font-size:12px;font-weight:700;color:var(--t3);line-height:1.4}
.diff-day-badge{font-size:10px;color:var(--tmut);font-weight:400;margin-left:4px}
.diff-old{font-size:11px;color:#e74c3c;margin-top:3px;font-style:italic}
.diff-note{font-size:10px;color:var(--tfnt);margin-top:3px}
.diff-unchanged{font-size:11px;color:var(--tvfnt);padding:8px 10px;border-top:1px solid var(--bg-th);margin-top:4px}
/* ── Toast ──────────────────────────────────────────────── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#2a7fc4;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity 0.25s,transform 0.25s;pointer-events:none;z-index:9999;white-space:nowrap}
.toast-show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-error{background:#c0392b}
/* DRAG & DROP SCENES */
.scene-drag-handle{cursor:grab;color:var(--tvfnt);font-size:17px;padding:0 5px 0 2px;user-select:none;flex-shrink:0;line-height:1;transition:color 0.1s}
.scene-drag-handle:hover{color:#5ba4e0}
.scene-drag-handle:active{cursor:grabbing}
.scene-block.drag-over-top{border-top:2px solid #3a90d4!important;margin-top:-2px}
.scene-block.drag-over-bottom{border-bottom:2px solid #3a90d4!important}
.scene-block.dragging{opacity:0.35}
.day-block.drag-over-day{outline:2px dashed #3a90d4;outline-offset:-2px}
.day-block.boneyard-block{margin-top:18px;opacity:0.92}
.day-block.boneyard-block .day-hdr{background:#6b7280}
.day-block.boneyard-block.drag-over-day{outline-color:#9ca3af}
.badge-day-si{background:var(--bg-bdsi);color:#3d9e6a;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;letter-spacing:0.3px;vertical-align:middle;margin-left:4px}
.si-day-row-actions{display:flex;align-items:center;gap:4px}
/* THEME TOGGLE */
.theme-toggle{background:transparent;border:1px solid var(--br);border-radius:5px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--tmut);cursor:pointer;letter-spacing:0.05em;transition:color 0.15s,background 0.15s,border-color 0.15s}
.theme-toggle:hover{color:var(--t1);background:var(--bg-hov)}
</style>

<script>
// ══════════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════════
const BUMP_LIB = [
  {cat:'Wardrobe', id:'w_maint',   label:'Personal wardrobe maintenance', amt:10},
  {cat:'Wardrobe', id:'w_formal',  label:'Formal evening wear / genuine furs', amt:25},
  {cat:'Wardrobe', id:'w_police',  label:'Police uniform (TV/Theatrical)', amt:36},
  {cat:'Props',    id:'p_pets',    label:'Pets', amt:23},
  {cat:'Props',    id:'p_golf',    label:'Golf clubs (set with bag)', amt:12},
  {cat:'Props',    id:'p_tennis',  label:'Tennis racquet', amt:5.50},
  {cat:'Props',    id:'p_luggage', label:'Luggage (per piece)', amt:5.50},
  {cat:'Props',    id:'p_camera',  label:'Camera', amt:5.50},
  {cat:'Props',    id:'p_skis',    label:'Skis and poles', amt:12},
  {cat:'Props',    id:'p_skates',  label:'Skates / skateboard', amt:5.50},
  {cat:'Vehicles', id:'v_auto',    label:'Auto', amt:37.50},
  {cat:'Vehicles', id:'v_trailer', label:'Trailer', amt:19},
  {cat:'Vehicles', id:'v_bicycle', label:'Bicycle', amt:12},
  {cat:'Vehicles', id:'v_moped',   label:'Moped', amt:15},
  {cat:'Vehicles', id:'v_moto',    label:'Motorcycle', amt:37.50},
  {cat:'Vehicles', id:'v_pmoto',   label:'Police motorcycle', amt:50},
  {cat:'Cosmetic', id:'c_bodymk',  label:'Body makeup (>50% of body)', amt:14},
  {cat:'Cosmetic', id:'c_hairgds', label:'Hair goods (spirit gum)', amt:14},
  {cat:'Cosmetic', id:'c_beard',   label:'Own natural beard required', amt:14},
  {cat:'Cosmetic', id:'c_skull',   label:'Skullcap', amt:14},
  {cat:'Cosmetic', id:'c_haircut', label:'Haircut required', amt:14},
  {cat:'Hazardous',id:'h_rain',    label:'Artificial rain', amt:14},
  {cat:'Hazardous',id:'h_smoke',   label:'Smoke exposure', amt:14},
  {cat:'Hazardous',id:'h_hazard',  label:'Hazardous work (NETCODE)', amt:100},
  {cat:'Hazardous',id:'h_wet',     label:'Wet or snow work', amt:14},
  {cat:'Special',  id:'s_photodbl',label:'Photo double (rate upgrade)', amt:0},
  {cat:'Special',  id:'s_fitting', label:'Costume fitting', amt:0},
];
const BUMP_MAP = Object.fromEntries(BUMP_LIB.map(b=>[b.id,b]));
const BUMP_CATS = [...new Set(BUMP_LIB.map(b=>b.cat))];

const RATE_TIERS = [
  {id:'sag',      label:'SAG',                   def:224},
  {id:'sag_hi',   label:'SAG Special Performer', def:234},
  {id:'nonunion', label:'Non-Union',             def:160},
  {id:'standin',  label:'Stand-In',              def:262},
  {id:'driver',   label:'Precision Driver',      def:400},
  {id:'custom',   label:'Custom Rate',           def:0},
];
const RATE_MAP = Object.fromEntries(RATE_TIERS.map(r=>[r.id,r]));

const CONTRACT_TYPES = [
  {id:'tv',         label:'TV — SAG Basic Agreement',        sagMin:25},
  {id:'theatrical', label:'Theatrical — SAG Basic Agreement',sagMin:85},
  {id:'lowbudget',  label:'Low Budget / Modified Agreement', sagMin:0},
  {id:'nonunion',   label:'Non-Union',                       sagMin:0},
  {id:'custom',     label:'Custom',                          sagMin:0},
];
// Default $/8-hour rates for each tier. User-editable on Setup → Contract card.
// Applied to NEW roles (parser import + Quick BG entry). On contract change, user
// is prompted whether to re-apply to existing roles.
const DEFAULT_RATES_FACTORY = {sag:224, sag_hi:234, nonunion:160, standin:262};
// One-shot bump: users who got the previous factory values stamped into their
// localStorage should auto-upgrade. Customized values are preserved (only an
// exact match against the old factory triggers replacement).
const OLD_DEFAULT_RATES_v1 = {sag:182, sag_hi:120, nonunion:160, standin:214};

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
function defaultState(){
  return {
    show:{name:'',episode:'',version:'1',preparedBy:'',role:'',contractType:'tv',sagMin:25,isSeries:false},
    standins:[],
    days:[],
    boneyard:[]
  };
}
let state=(()=>{try{const s=localStorage.getItem('bgboard');return s?JSON.parse(s):defaultState();}catch(e){return defaultState();}})();
// Migrate old state fields
if(!state.show.contractType) state.show.contractType='tv';
if(state.show.sagMin===undefined) state.show.sagMin=25;
if(state.show.role===undefined) state.show.role='';
if(state.show.isSeries===undefined) state.show.isSeries=false;
if(state.show.showCost===undefined) state.show.showCost=true;
if(!Array.isArray(state.boneyard)) state.boneyard=[];
if(!state.show.defaultRates) state.show.defaultRates={...DEFAULT_RATES_FACTORY};
else if(JSON.stringify(state.show.defaultRates)===JSON.stringify(OLD_DEFAULT_RATES_v1))
  state.show.defaultRates={...DEFAULT_RATES_FACTORY};

let currentTab='breakdown';
let expandedDays={};
// Active save tracking
let _saveId=null, _saveName=null;

function save(){try{localStorage.setItem('bgboard',JSON.stringify(state));}catch(e){}}

// ══════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════
function uid(){return Math.random().toString(36).slice(2,10);}

function calcPay(baseRate,hours,bumps){
  baseRate=parseFloat(baseRate)||0; hours=parseFloat(hours)||0;
  const hr=baseRate/8;
  let pay=baseRate;
  if(hours>8&&hours<=12) pay+=(hours-8)*hr*1.5;
  else if(hours>12){pay+=4*hr*1.5;pay+=(hours-12)*hr*2;}
  (bumps||[]).forEach(b=>pay+=parseFloat(b.amt)||0);
  return pay;
}

function $m(n){return '$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}

function fmtDate(d){
  if(!d) return '';
  try{const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
  catch(e){return d;}
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function getDayStats(day){
  let sag=0,nu=0,cost=0;
  // Reuse model (per role):
  //  • role.reuseOf = {roleId:'xxx', count:N>0}   → explicit reuse of N people from role xxx
  //  • role.reuseOf = {roleId:'',    count:0}     → explicit "None / different people" (bypass auto)
  //  • role.reuseOf absent                        → auto-by-name fallback: same name = same group,
  //                                                 max-count wins, others contribute 0
  const allRoles=[];
  day.scenes.forEach(sc=>(sc.roles||[]).forEach(r=>allRoles.push(r)));
  const idSet=new Set(allRoles.map(r=>r.id));

  // Auto-bucket: only roles WITHOUT explicit reuseOf participate. For each
  // normalized non-empty name, the max-count role wins; others get 0.
  const autoWinner=new Map(); // key: normalized name → roleId
  const autoCand=new Map();   // key → {n, roleId}
  allRoles.forEach(r=>{
    if(r.reuseOf) return;
    const key=(r.type||'').trim().toLowerCase();
    if(!key) return;
    const n=parseInt(r.count)||1;
    const prev=autoCand.get(key);
    if(!prev||n>prev.n) autoCand.set(key,{n,roleId:r.id});
  });
  autoCand.forEach((v,k)=>autoWinner.set(k,v.roleId));

  allRoles.forEach(r=>{
    const n=parseInt(r.count)||1;
    let contrib=n;
    if(r.reuseOf){
      const rc=parseInt(r.reuseOf.count)||0;
      const parentId=r.reuseOf.roleId||'';
      if(parentId&&rc>0&&idSet.has(parentId)){
        contrib=Math.max(0,n-rc);
      }
      // explicit None or orphaned parent → contrib stays at full count
    } else {
      const key=(r.type||'').trim().toLowerCase();
      if(key){
        const winnerId=autoWinner.get(key);
        if(winnerId&&winnerId!==r.id) contrib=0;
      }
    }
    if(r.tier==='nonunion') nu+=contrib; else sag+=contrib;
    cost+=calcPay(r.baseRate,r.hours,r.bumps)*contrib;
  });

  const globalSiCount=state.standins.filter(si=>!(day.standinOff||{})[si.id]).length;
  const daySiCount=(day.dayStandins||[]).length;
  const siCount=globalSiCount+daySiCount;
  return {sag,nu,siCount,cost};
}

function getSIHours(day,si){
  if((day.standinOff||{})[si.id]) return null; // off
  const h=(day.standinHours||{})[si.id];
  return h!==undefined?Math.max(8,h):Math.max(8,si.defaultHours||8);
}

// Display info for the Reuse column. Returns null, or {explicit, label}.
//  • explicit reuse → "2 of 5 from Sc. 12 Teachers"
//  • auto-link (loser side of same-name match) → "Auto-link: Sc. 12 Teachers"
//  • explicit None, auto-link winners, anonymous, and roles with no peers → null
function reuseDisplayInfo(role,day){
  if(!role||!day) return null;
  // Helper: find a role on this day by id, plus its scene
  const findOnDay=(id)=>{
    for(const sc of (day.scenes||[])){
      const r=(sc.roles||[]).find(x=>x.id===id);
      if(r) return {sc,r};
    }
    return null;
  };
  // Explicit reuse
  if(role.reuseOf&&role.reuseOf.roleId&&(parseInt(role.reuseOf.count)||0)>0){
    const found=findOnDay(role.reuseOf.roleId);
    if(!found) return null; // orphan parent — render nothing
    const ref=found.sc.sceneId?'Sc. '+found.sc.sceneId:('Day '+day.dayNumber);
    return {explicit:true,label:`${role.reuseOf.count} of ${role.count||1} from ${ref}: ${found.r.type}`};
  }
  // Explicit None — show nothing (user opted out of any reuse display)
  if(role.reuseOf) return null;
  // Auto-by-name fallback display
  const key=(role.type||'').trim().toLowerCase();
  if(!key) return null;
  let winnerId=null,maxN=-1;
  (day.scenes||[]).forEach(sc=>(sc.roles||[]).forEach(r=>{
    if(r.reuseOf) return;
    if((r.type||'').trim().toLowerCase()!==key) return;
    const n=parseInt(r.count)||1;
    if(n>maxN){maxN=n;winnerId=r.id;}
  }));
  if(!winnerId||winnerId===role.id) return null; // I'm the winner, or no peers
  const found=findOnDay(winnerId);
  if(!found) return null;
  const ref=found.sc.sceneId?'Sc. '+found.sc.sceneId:('Day '+day.dayNumber);
  return {explicit:false,label:`Auto-link: ${ref} ${found.r.type}`};
}

function sagMinWarning(day,stats){
  const min=parseInt(state.show.sagMin)||0;
  if(min===0||stats.nu===0) return null;
  if(stats.sag<min) return `⚠ SAG minimum not met — need ${min-stats.sag} more SAG (min: ${min})`;
  return null;
}

// ══════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════
function render(){
  updateNavInfo(); updateNavTabs();
  document.getElementById('main').innerHTML=
    currentTab==='setup'?renderSetup():currentTab==='breakdown'?renderBreakdown():renderExport();
  attachDayToggles();
  const footer=document.getElementById('app-footer');
  if(footer) footer.style.display=currentTab==='setup'?'flex':'none';
}

function updateNavInfo(){
  const el=document.getElementById('nav-info');
  const savePart=_saveName
    ?`<span style="color:#3a7bd5;font-weight:700">${esc(_saveName)}</span>`
    :'<span style="color:var(--tfnt);font-style:italic">unsaved</span>';
  el.innerHTML=`<span style="font-size:12px">${savePart}</span>`;
}
function updateNavTabs(){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===currentTab));
}
function attachDayToggles(){
  document.querySelectorAll('.day-hdr').forEach(hdr=>{
    hdr.addEventListener('click',e=>{
      if(e.target.closest('button')&&!e.target.classList.contains('day-toggle-btn')) return;
      const id=hdr.dataset.dayId;
      expandedDays[id]=!expandedDays[id];
      const body=document.getElementById('day-body-'+id);
      const tog=document.getElementById('day-tog-'+id);
      if(body) body.classList.toggle('open',expandedDays[id]);
      if(tog)  tog.textContent=expandedDays[id]?'▼':'▶';
    });
  });
  attachDragHandlers();
}

// ══════════════════════════════════════════════════════════
// DRAG & DROP — Scene reordering within a day, moving between days,
// and archiving to/from the boneyard.
// ══════════════════════════════════════════════════════════
let _dragSceneId=null,_dragDayId=null;

// Source resolver — finds the scene + its container (day or boneyard).
// Returns {container, scenes, idx, scene} or null.
function _findSceneSource(dayId, sceneId){
  if(dayId==='__boneyard__'){
    const arr=state.boneyard||[];
    const idx=arr.findIndex(s=>s.id===sceneId);
    if(idx<0) return null;
    return {container:'boneyard', scenes:arr, idx, scene:arr[idx]};
  }
  const day=state.days.find(d=>d.id===dayId);
  if(!day) return null;
  const idx=(day.scenes||[]).findIndex(s=>s.id===sceneId);
  if(idx<0) return null;
  return {container:'day', day, scenes:day.scenes, idx, scene:day.scenes[idx]};
}

function _removeSceneFromSource(src){
  return src.scenes.splice(src.idx,1)[0];
}

function attachDragHandlers(){
  document.querySelectorAll('.scene-block[draggable]').forEach(block=>{
    block.addEventListener('dragstart',e=>{
      if(e.target.closest('button')||e.target.closest('input')||e.target.closest('select')) {
        e.preventDefault(); return;
      }
      _dragSceneId=block.dataset.sceneId;
      _dragDayId=block.dataset.dayId;
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',_dragSceneId);
      setTimeout(()=>block.classList.add('dragging'),0);
    });
    block.addEventListener('dragend',()=>{
      block.classList.remove('dragging');
      document.querySelectorAll('.scene-block').forEach(b=>
        b.classList.remove('drag-over-top','drag-over-bottom'));
      document.querySelectorAll('.day-block').forEach(b=>
        b.classList.remove('drag-over-day'));
      _dragSceneId=null; _dragDayId=null;
    });
    block.addEventListener('dragover',e=>{
      if(!_dragSceneId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      const rect=block.getBoundingClientRect();
      const midY=rect.top+rect.height/2;
      document.querySelectorAll('.scene-block').forEach(b=>
        b.classList.remove('drag-over-top','drag-over-bottom'));
      block.classList.add(e.clientY<midY?'drag-over-top':'drag-over-bottom');
    });
    block.addEventListener('dragleave',e=>{
      if(!e.relatedTarget||!block.contains(e.relatedTarget))
        block.classList.remove('drag-over-top','drag-over-bottom');
    });
    block.addEventListener('drop',e=>{
      e.preventDefault(); e.stopPropagation();
      const targetSceneId=block.dataset.sceneId;
      const targetDayId=block.dataset.dayId;
      block.classList.remove('drag-over-top','drag-over-bottom');
      if(!_dragSceneId||_dragSceneId===targetSceneId) return;

      const src=_findSceneSource(_dragDayId,_dragSceneId);
      if(!src) return;
      const tgt=_findSceneSource(targetDayId,targetSceneId);
      if(!tgt) return;

      const moved=_removeSceneFromSource(src);
      // src removal may have shifted the target's idx if same container — recompute.
      const tgtList=targetDayId==='__boneyard__'?(state.boneyard||[]):
        (state.days.find(d=>d.id===targetDayId)||{}).scenes||[];
      let toIdx=tgtList.findIndex(s=>s.id===targetSceneId);
      if(toIdx<0) toIdx=tgtList.length;
      const rect=block.getBoundingClientRect();
      const dropBefore=e.clientY<(rect.top+rect.height/2);
      tgtList.splice(dropBefore?toIdx:toIdx+1,0,moved);
      save(); render();
      const where=targetDayId==='__boneyard__'?'Boneyard':
        (_dragDayId===targetDayId?'reordered':`Day ${(state.days.find(d=>d.id===targetDayId)||{}).dayNumber||'?'}`);
      showToast(`Scene → ${where}`);
    });
  });

  // Day-block-level drop target: lets you drop onto an empty day or into a
  // gap below the last scene. Also handles dropping into the boneyard.
  document.querySelectorAll('.day-block').forEach(block=>{
    const dayId=block.dataset.dayId
      || block.querySelector('[data-day-id]')?.dataset.dayId;
    if(!dayId) return;
    block.addEventListener('dragover',e=>{
      if(!_dragSceneId) return;
      // Only highlight if the drop will actually go to this day (not a
      // bubbling event from a scene block inside another day).
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      document.querySelectorAll('.day-block').forEach(b=>
        b.classList.remove('drag-over-day'));
      block.classList.add('drag-over-day');
    });
    block.addEventListener('dragleave',e=>{
      if(!e.relatedTarget||!block.contains(e.relatedTarget))
        block.classList.remove('drag-over-day');
    });
    block.addEventListener('drop',e=>{
      // If the inner scene-block already handled the drop, skip.
      if(e.defaultPrevented) return;
      e.preventDefault();
      block.classList.remove('drag-over-day');
      if(!_dragSceneId) return;
      // Resolve target day id from the block (boneyard uses sentinel id).
      const targetDayId=block.classList.contains('boneyard-block')?'__boneyard__':
        (block.dataset.dayId || block.querySelector('[data-day-id]')?.dataset.dayId);
      if(!targetDayId||targetDayId===_dragDayId){return;}
      const src=_findSceneSource(_dragDayId,_dragSceneId);
      if(!src) return;
      const moved=_removeSceneFromSource(src);
      if(targetDayId==='__boneyard__'){
        (state.boneyard=state.boneyard||[]).push(moved);
      } else {
        const day=state.days.find(d=>d.id===targetDayId);
        if(!day){ src.scenes.splice(src.idx,0,moved); return; }
        day.scenes.push(moved);
      }
      save(); render();
      const where=targetDayId==='__boneyard__'?'Boneyard':`Day ${(state.days.find(d=>d.id===targetDayId)||{}).dayNumber||'?'}`;
      showToast(`Scene → ${where}`);
    });
  });
}

function updateShow(key,val){state.show[key]=val;save();updateNavInfo();}

function onContractChange(val){
  const ct=CONTRACT_TYPES.find(c=>c.id===val)||CONTRACT_TYPES[0];
  state.show.contractType=val;
  state.show.sagMin=ct.sagMin;
  // For non-union shows, flip every existing role's tier to nonunion as a default
  // assumption — user can override per role. We only prompt if there are roles.
  const hasRoles=(state.days||[]).some(d=>(d.scenes||[]).some(sc=>(sc.roles||[]).length>0));
  save();
  if(hasRoles){
    const msg=val==='nonunion'
      ? 'Apply Non-Union tier and the current Non-Union default rate to all existing background roles?'
      : 'Apply current default rates to all existing background roles? (Their tiers will be kept.)';
    if(confirm(msg)){
      if(val==='nonunion') retierAllRoles('nonunion');
      applyDefaultRatesToAll(true);
      return; // applyDefaultRatesToAll re-renders
    }
  }
  render();
}

function updateDefaultRate(tierId,val){
  const n=parseFloat(val);
  state.show.defaultRates[tierId]=isNaN(n)?0:n;
  save();
}

function applyDefaultRatesToAll(silent){
  const dr=state.show.defaultRates||{};
  let n=0;
  (state.days||[]).forEach(d=>(d.scenes||[]).forEach(sc=>(sc.roles||[]).forEach(r=>{
    const newRate=dr[r.tier];
    if(newRate!==undefined && newRate!==null){r.baseRate=newRate; n++;}
  })));
  save(); render();
  if(!silent) alert(n?`Updated base rate on ${n} role${n===1?'':'s'}.`:'No background roles to update.');
}

function retierAllRoles(tierId){
  (state.days||[]).forEach(d=>(d.scenes||[]).forEach(sc=>(sc.roles||[]).forEach(r=>{r.tier=tierId;})));
  save();
}

function deleteStandin(id){
  if(!confirm('Remove this stand-in?')) return;
  state.standins=state.standins.filter(s=>s.id!==id);
  save(); render();
}

      <button class="btn btn-primary" onclick="document.getElementById('add-day-card').style.display='block';document.getElementById('new-day-num').focus()">+ Add Shooting Day</button>
    </div>
    ${addForm}
    ${state.days.length===0?`<div class="empty card"><div class="empty-icon">🎬</div>No shooting days yet.<br><br><label class="btn btn-primary btn-sm" style="cursor:pointer;margin-top:4px" title="Import a scheduling PDF"><span>↓ Import Shooting Schedule</span><input type="file" accept=".pdf" style="display:none" onchange="importPDF(event)"></label></div>`:''}
    ${tp==='top'?totalsStrip:''}
    ${dayBlocks}
    ${tp==='bottom'?totalsStrip:''}
    ${renderBoneyard()}`;
}

// Boneyard: scenes parked outside the schedule (omitted, stock, already shot).
// Collapsed by default; drag targets so scenes can move in or out.
let _boneyardExpanded=false;
function toggleBoneyard(){_boneyardExpanded=!_boneyardExpanded;render();}
function renderBoneyard(){
  const items=state.boneyard||[];
  // Render the boneyard whenever it exists OR has items (so the drop zone is
  // always available once a schedule has been imported).
  if(!items.length && !state.days.length) return '';
  const scenesHTML=items.map(sc=>{
    const roles=(sc.roles||[]);
    const roleRows=roles.map(r=>{
      const bTags=(r.bumps||[]).map(b=>`<span class="bump-tag">${esc(b.label||b.name||'')}</span>`).join('');
      const tier=RATE_MAP[r.tier]||{label:r.tier};
      return `<tr>
        <td style="text-align:center;width:30px"><span class="edit-icon">✎</span></td>
        <td><strong>${r.count||1}</strong></td>
        <td style="font-weight:600;color:var(--t2)">${esc(r.type)}</td>
        <td><span class="badge badge-${esc(r.tier||'sag')}">${esc(tier.label)}</span></td>
        <td style="color:var(--tfnt)">$${r.baseRate}/8</td>
        <td style="color:var(--tfnt)">${r.hours}h</td>
        <td>${bTags?`<div class="bump-tags">${bTags}</div>`:'<span style="color:var(--br)">—</span>'}</td>
        <td style="color:var(--tmut);font-size:11px">${esc(r.notes||'—')}</td>
        <td></td>
      </tr>`;
    }).join('');
    return `<div class="scene-block" draggable="true" data-scene-id="${sc.id}" data-day-id="__boneyard__">
      <table class="roles-table">
        <colgroup>
          <col class="col-edit"><col class="col-count"><col class="col-type">
          <col class="col-tier"><col class="col-rate"><col class="col-hours">
          <col class="col-bumps"><col class="col-notes"><col class="col-reuse">
        </colgroup>
        <tr class="scene-hdr-row">
          <td class="shdr-main" colspan="7"><div class="shdr-inner"><span class="scene-drag-handle" title="Drag back to a day">⠿</span>${sc.sceneId?`<span class="scene-id">Sc ${esc(sc.sceneId)}</span>`:''}<span class="scene-set">${esc(sc.set||'(no set)')}</span>${sc.desc?`<span class="scene-desc"> — ${esc(sc.desc)}</span>`:''}</div></td>
          <td class="shdr-btns" colspan="2">
            <button class="btn btn-danger btn-xs" onclick="deleteBoneyardScene('${sc.id}')" title="Remove from boneyard">✕</button>
          </td>
        </tr>
        ${roles.length?`<tbody>${roleRows}</tbody>`:`<tr class="no-roles-row"><td colspan="9" style="font-size:12px;color:var(--tmut);padding:8px 12px 10px;font-style:italic">No BG</td></tr>`}
      </table>
    </div>`;
  }).join('');
  return `<div class="day-block boneyard-block" data-day-id="__boneyard__">
    <div class="day-hdr boneyard-hdr" onclick="toggleBoneyard()" style="cursor:pointer">
      <div class="day-hdr-left">
        <span style="color:#fff;font-size:11px;width:16px">${_boneyardExpanded?'▼':'▶'}</span>
        <span class="day-label">Boneyard</span>
        <span class="day-date-str" style="opacity:0.7">omitted · stock · already shot</span>
      </div>
      <div class="day-stats">
        <span class="day-stat"><strong>${items.length}</strong> scene${items.length===1?'':'s'}</span>
      </div>
    </div>
    <div class="day-body ${_boneyardExpanded?'open':''}" data-boneyard-body="1">
      ${items.length?scenesHTML:`<div class="empty" style="padding:14px;font-style:italic;color:var(--tmut)">Drop a scene here to archive it.</div>`}
    </div>
  </div>`;
}
function deleteBoneyardScene(sceneId){
  if(!confirm('Permanently delete this scene from the boneyard?')) return;
  state.boneyard=(state.boneyard||[]).filter(sc=>sc.id!==sceneId);
  save(); render();
}

  let gSI=0,gSAG=0,gNU=0,gCost=0;

    if(workingSIs.length){

    <div class="print-show-title">${s.episode?esc(s.episode)+' ':''} Extras Breakdown</div>
    <div class="print-meta" style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <span>${s.name?`<strong>Show:</strong> ${esc(s.name)} &nbsp;|&nbsp; <strong>Version:</strong> ${esc(s.version||'—')}`:''}</span>

    </div>

    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--tlbl);margin-bottom:12px">Grand Totals</div>

      <div class="grand-item"><div class="glbl">Stand-Ins</div><div class="gval" style="color:#52b788">${gSI}</div></div>

      <div class="grand-item"><div class="glbl">Total BG + SI</div><div class="gval" style="color:#2a7fc4">${gSI+gSAG+gNU}</div></div>

// ══════════════════════════════════════════════════════════
// PDF DOWNLOAD (client-side via jsPDF + autoTable)
// ══════════════════════════════════════════════════════════
// Replaces window.print() — Safari's "Save as PDF" dropdown spawns a blank
// handoff tab that confuses users. Generating the PDF in JS bypasses the
// OS print dialog entirely and works identically in Safari / Chrome / FF.
function downloadPDF(){
  if(!state.days || !state.days.length){
    showToast('Nothing to export yet — add a shooting day first', 'error');
    return;
  }
  if(typeof window.jspdf === 'undefined' || !window.jspdf.jsPDF){
    showToast('PDF library still loading — try again in a moment', 'error');
    return;
  }
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'letter', orientation:'portrait'});
  const M = 36;                                   // page margin (1/2")
  const pageW = doc.internal.pageSize.getWidth();
  const showCost = state.show.showCost !== false;
  const s = state.show;

  // ── Title block ───────────────────────────────────────────
  doc.setFont('helvetica','bold').setFontSize(18).setTextColor(0);
  const titleTxt = (s.episode ? s.episode + ' ' : '') + 'Extras Breakdown';
  doc.text(titleTxt, M, M + 8);
  doc.setDrawColor(42,127,196).setLineWidth(2).line(M, M+14, pageW-M, M+14);

  doc.setFont('helvetica','normal').setFontSize(10).setTextColor(60);
  const metaLines = [];
  if(s.name) metaLines.push(`Show: ${s.name}    Version: ${s.version||'—'}`);
  if(s.preparedBy) metaLines.push(`Prepared by: ${s.preparedBy}${s.role?' · '+s.role:''}`);
  let cursorY = M + 28;
  metaLines.forEach(line => { doc.text(line, M, cursorY); cursorY += 12; });
  cursorY += 6;

  // Running grand totals (computed alongside per-day rendering)
  let gSI=0, gSAG=0, gNU=0, gCost=0;

  // ── Per-day blocks ────────────────────────────────────────
  state.days.forEach((day, dayIdx) => {
    const stats = getDayStats(day);
    gSI += stats.siCount; gSAG += stats.sag; gNU += stats.nu; gCost += stats.cost;

    // Page-break check: keep day header + first table row together
    if(cursorY > 700){ doc.addPage(); cursorY = M; }

    // Day header band
    doc.setFillColor(42,127,196).rect(M, cursorY, pageW-2*M, 22, 'F');
    doc.setFont('helvetica','bold').setFontSize(11).setTextColor(255);
    doc.text(`DAY ${day.dayNumber} — ${day.date ? fmtDate(day.date) : 'Date TBD'}`, M+10, cursorY+15);
    cursorY += 22;

    // Build table rows
    const body = [];
    const workingSIs = state.standins.filter(si => !(day.standinOff||{})[si.id]);
    if(workingSIs.length){
      body.push([{content:'STAND-INS', colSpan:6, styles:{fillColor:[245,245,245], fontStyle:'bold', textColor:[80,80,80], fontSize:8}}]);
      workingSIs.forEach(si => {
        const h = getSIHours(day, si);
        body.push([
          {content:'1', styles:{halign:'center'}},
          `${si.name} — ${si.character||'—'}`,
          `$${si.rate}/8`,
          String(h),
          '—',
          {content:'—', styles:{fillColor:[232,244,255]}}
        ]);
      });
    }
    (day.scenes||[]).forEach(sc => {
      const hdr = (sc.sceneId ? `Sc. ${sc.sceneId} · ` : '') + (sc.set||'') + (sc.desc ? ` — ${sc.desc}` : '');
      body.push([{content:hdr, colSpan:6, styles:{fillColor:[235,235,235], fontStyle:'bold', textColor:[60,60,60], fontSize:8}}]);
      (sc.roles||[]).forEach(r => {
        const bumpStr = (r.bumps||[]).map(b => b.label).join(', ') || '—';
        const reuse = reuseDisplayInfo(r, day);
        const notes = (r.notes||'') + (reuse ? ` [${reuse.label}]` : '');
        body.push([
          {content:String(r.count||1) + (r.minors?' (m)':''), styles:{halign:'center'}},
          r.type||'',
          `$${r.baseRate}/8`,
          String(r.hours),
          bumpStr,
          notes || '—'
        ]);
      });
    });

    doc.autoTable({
      startY: cursorY,
      head: [['#','Type','Rate','Hrs','Bumps','Notes']],
      body,
      theme:'grid',
      margin:{left:M, right:M},
      styles:{fontSize:9, cellPadding:4, overflow:'linebreak', textColor:[20,20,20], lineColor:[180,180,180]},
      headStyles:{fillColor:[235,235,235], textColor:[60,60,60], fontStyle:'bold', fontSize:8},
      columnStyles:{
        0:{cellWidth:30, halign:'center'},
        1:{cellWidth:170},
        2:{cellWidth:55},
        3:{cellWidth:35, halign:'center'},
        4:{cellWidth:120},
        5:{cellWidth:'auto'}
      },
      didDrawPage: () => {} // (placeholder — could add footer here later)
    });
    cursorY = doc.lastAutoTable.finalY + 4;

    // Day totals strip
    if(cursorY > 720){ doc.addPage(); cursorY = M; }
    doc.setFillColor(248,248,248).rect(M, cursorY, pageW-2*M, 18, 'F');
    doc.setDrawColor(180).setLineWidth(0.5).rect(M, cursorY, pageW-2*M, 18, 'S');
    doc.setFont('helvetica','bold').setFontSize(9).setTextColor(40);
    const totalsLeft = `TOTAL EXTRAS (excl SI's): ${stats.sag+stats.nu}    STAND-INS: ${stats.siCount}    SAG: ${stats.sag}    NON UNION: ${stats.nu}`;
    doc.text(totalsLeft, M+8, cursorY+12);
    if(showCost){
      const costTxt = `Est: ${$m(stats.cost)}`;
      const w = doc.getTextWidth(costTxt);
      doc.setTextColor(82,183,136).text(costTxt, pageW-M-w-8, cursorY+12);
    }
    cursorY += 26;
  });

  // ── Grand totals block ────────────────────────────────────
  if(cursorY > 680){ doc.addPage(); cursorY = M; }
  doc.setFillColor(248,248,248).rect(M, cursorY, pageW-2*M, 60, 'F');
  doc.setDrawColor(170).setLineWidth(0.5).rect(M, cursorY, pageW-2*M, 60, 'S');
  doc.setFont('helvetica','bold').setFontSize(9).setTextColor(120);
  doc.text('GRAND TOTALS', M+10, cursorY+14);

  const cells = [
    ['Stand-Ins', String(gSI), [82,183,136]],
    ['SAG Background', String(gSAG), [69,123,157]],
    ['Non-Union', String(gNU), [155,114,207]],
    ['Total BG + SI', String(gSI+gSAG+gNU), [42,127,196]],
  ];
  const cellW = (pageW - 2*M - 20) / cells.length;
  cells.forEach((c, i) => {
    const cx = M + 10 + i*cellW;
    doc.setFont('helvetica','normal').setFontSize(8).setTextColor(140);
    doc.text(c[0].toUpperCase(), cx, cursorY+30);
    doc.setFont('helvetica','bold').setFontSize(18).setTextColor(c[2][0], c[2][1], c[2][2]);
    doc.text(c[1], cx, cursorY+50);
  });
  cursorY += 60;
  if(showCost){
    doc.setFont('helvetica','normal').setFontSize(11).setTextColor(60);
    doc.text('Estimated Total Cost:', M+10, cursorY+16);
    doc.setFont('helvetica','bold').setFontSize(13).setTextColor(82,183,136);
    doc.text($m(gCost), M+10+doc.getTextWidth('Estimated Total Cost: '), cursorY+16);
  }

  // ── Filename: show + episode + date ───────────────────────
  const safe = x => String(x||'').replace(/[^a-z0-9_\-]+/gi,'_').replace(/^_+|_+$/g,'');
  const stamp = new Date().toISOString().slice(0,10);
  const fname = [safe(s.name)||'BGBoard', safe(s.episode), 'ExtrasBreakdown', stamp].filter(Boolean).join('_') + '.pdf';
  doc.save(fname);
}

// DAY / SCENE / ROLE OPS
// ══════════════════════════════════════════════════════════
function addDay(){
  const num=document.getElementById('new-day-num').value;
  if(!num){alert('Day number required');return;}
  const id=uid();
  state.days.push({id,dayNumber:parseInt(num),date:document.getElementById('new-day-date').value,scenes:[],standinOff:{},standinHours:{}});
  state.days.sort((a,b)=>a.dayNumber-b.dayNumber);
  expandedDays[id]=true;
  save();render();
}
function deleteDay(id){if(!confirm('Delete this day and all scenes?'))return;state.days=state.days.filter(d=>d.id!==id);save();render();}
function setDayDate(id,val){const d=state.days.find(x=>x.id===id);if(!d)return;d.date=val||'';save();render();}
function getTotalsPos(){return (state.preferences&&state.preferences.totalsPosition)||'top';}
function toggleTotalsPos(){state.preferences=state.preferences||{};state.preferences.totalsPosition=getTotalsPos()==='top'?'bottom':'top';save();render();}
function deleteScene(dayId,sceneId){if(!confirm('Delete this scene?'))return;const d=state.days.find(x=>x.id===dayId);if(d)d.scenes=d.scenes.filter(s=>s.id!==sceneId);save();render();}
function deleteRole(dayId,sceneId,roleId){const d=state.days.find(x=>x.id===dayId);const s=d?.scenes.find(x=>x.id===sceneId);if(s)s.roles=(s.roles||[]).filter(r=>r.id!==roleId);save();render();}

function toggleSIOff(dayId,siId,isOff){
  const day=state.days.find(d=>d.id===dayId);if(!day)return;
  if(!day.standinOff) day.standinOff={};
  day.standinOff[siId]=isOff;
  save();render();
}
function updateSIHours(dayId,siId,val){
  const day=state.days.find(d=>d.id===dayId);if(!day)return;
  if(!day.standinHours) day.standinHours={};
  day.standinHours[siId]=Math.max(8,parseFloat(val)||8);
  save();
}

function saveScene(dayId,sceneId){

  if(!set){alert('Set/Location required');return;}
  const day=state.days.find(d=>d.id===dayId);if(!day)return;
  const rawId=document.getElementById('sc-id').value.trim();
  const desc=document.getElementById('sc-desc').value.trim();
  // Bulk create: comma-separated IDs in add mode
  if(!sceneId&&rawId.includes(',')){
    const ids=rawId.split(',').map(s=>s.trim()).filter(Boolean);
    ids.forEach(id=>{
      if(!day.scenes.find(s=>s.sceneId===id))
        day.scenes.push({id:uid(),sceneId:id,set,desc,roles:[]});
    });
    save();closeModal();render();return;
  }
  const sc={id:sceneId||uid(),sceneId:rawId,set,desc,roles:[]};
  if(sceneId){const ex=day.scenes.find(s=>s.id===sceneId);if(ex)sc.roles=ex.roles||[];}
  day.scenes=day.scenes.filter(s=>s.id!==sceneId);
  day.scenes.push(sc);
  save();closeModal();render();
}

// Parse plain-text BG entries like "(10) Doctors 12hrs, (8) Nurses"
function parseQuickBGText(text){
  const roles=[];
  // Split on newlines or semicolons
  const lines=text.split(/[\n;]+/).map(l=>l.trim()).filter(Boolean);
  for(const line of lines){
    // Each line: (n) description [Nh] OR n description [Nh]
    let m=line.match(/^\((\d+)\)\s+(.+)/);
    if(!m) m=line.match(/^(\d+)\s+(.+)/);
    if(!m) continue;
    const count=parseInt(m[1]);
    let rest=m[2].trim();
    // Extract hours: "12h", "12hrs", "for 12h", "for 12hrs"
    let hours=8;
    const hm=rest.match(/(?:for\s+)?(\d+(?:\.\d+)?)\s*h(?:rs?)?/i);
    if(hm){
      hours=parseFloat(hm[1]);
      rest=rest.replace(hm[0],'').trim().replace(/\s+/g,' ');
    }
    const type=rest.replace(/^for\s+/i,'').trim();
    if(type){
      const tier=state.show.contractType==='nonunion'?'nonunion':'sag';
      const baseRate=(state.show.defaultRates&&state.show.defaultRates[tier])||(tier==='nonunion'?160:224);
      roles.push({id:uid(),type,count,tier,baseRate,hours,bumps:[],notes:'',minors:false});
    }
  }
  return roles;
}

function saveRole(dayId,sceneId,roleId){
  const type=document.getElementById('r-type').value.trim();
  if(!type){alert('Role type required');return;}
  const role={
    id:roleId||uid(), type,
    count:parseInt(document.getElementById('r-count').value)||1,
    tier:document.getElementById('r-tier').value,
    baseRate:parseFloat(document.getElementById('r-rate').value)||0,
    hours:Math.max(8,parseFloat(document.getElementById('r-hours').value)||8),
    bumps:[..._bumps],
    notes:document.getElementById('r-notes').value.trim(),
    minors:document.getElementById('r-minors').checked
  };
  // Persist reuseOf:
  //  • specific role + count>0      → {roleId, count}  (explicit reuse)
  //  • "None" picked, changed from default → {roleId:'', count:0}  (explicit None)
  //  • default unchanged and count=0       → omit (auto-fallback applies)
  const rfEl=document.getElementById('r-reuse-from');
  const rcEl=document.getElementById('r-reuse-count');
  if(rfEl){
    const rfVal=rfEl.value;
    const rfDefault=rfEl.dataset.default||'';
    const rcVal=parseInt(rcEl?.value)||0;
    if(rfVal&&rcVal>0){
      role.reuseOf={roleId:rfVal,count:rcVal};
    } else if(!rfVal && rfDefault){
      // User changed the dropdown from a same-name suggestion to "None" — explicit opt-out
      role.reuseOf={roleId:'',count:0};
    }
    // else: leave role.reuseOf undefined — auto-by-name fallback governs
  }

  // Look up peers (other roles whose type matches this one BEFORE the edit).
  // Only on edit — for new roles there's no prior state to spread from.
  const day=state.days.find(d=>d.id===dayId);
  if(!day) return;
  const sc=day.scenes.find(s=>s.id===sceneId);
  if(!sc) return;
  let originalType=null;
  if(roleId){
    const orig=(sc.roles||[]).find(r=>r.id===roleId);
    originalType=(orig?.type||'').trim().toLowerCase();
  }
  const peers={today:[],otherDays:[]};
  if(originalType){
    (day.scenes||[]).forEach(s=>{
      (s.roles||[]).forEach(r=>{
        if(r.id===roleId) return;
        if((r.type||'').trim().toLowerCase()===originalType){
          peers.today.push({day,scene:s,role:r});
        }
      });
    });
    state.days.forEach(d=>{
      if(d.id===dayId) return;
      (d.scenes||[]).forEach(s=>{
        (s.roles||[]).forEach(r=>{
          if((r.type||'').trim().toLowerCase()===originalType){
            peers.otherDays.push({day:d,scene:s,role:r});
          }
        });
      });
    });
  }

  // If no peers, save and exit immediately.
  if(!peers.today.length && !peers.otherDays.length){
    _applyRoleSave(sc, role, []);
    return;
  }

  // Otherwise ask which scope to apply to.
  _promptPropagation(sc, role, originalType, peers);
}

// Replace the role in-place on its scene, then apply the same field changes
// to peers (keeping each peer's id and reuseOf). Closes the modal + saves.
function _applyRoleSave(sc, newRole, peerList){
  sc.roles=(sc.roles||[]).filter(r=>r.id!==newRole.id);
  sc.roles.push(newRole);
  // Apply propagatable fields. We intentionally skip id and reuseOf
  // (those are per-instance), but type/count/tier/rate/hours/bumps/notes/
  // minors all carry over.
  peerList.forEach(({role:peerRole})=>{
    peerRole.type=newRole.type;
    peerRole.count=newRole.count;
    peerRole.tier=newRole.tier;
    peerRole.baseRate=newRole.baseRate;
    peerRole.hours=newRole.hours;
    peerRole.bumps=JSON.parse(JSON.stringify(newRole.bumps||[]));
    peerRole.notes=newRole.notes;
    peerRole.minors=newRole.minors;
  });
  save(); closeModal(); render();
  if(peerList.length){
    showToast(`Applied to ${peerList.length+1} role${peerList.length?'s':''}`);
  }
}

function _promptPropagation(sc, newRole, originalType, peers){
  const todayN=peers.today.length;
  const otherN=peers.otherDays.length;
  const totalN=todayN+otherN;
  const label=esc(originalType||newRole.type);
  // Stash the data on window so the inline onclicks can read it without
  // serializing arrays into the HTML. Cleared by closeModal via reset on render.
  window._propagationCtx={sc,newRole,peers};
  openModal(`
    <div class="modal-title">Apply to other "${label}" groups?
      <button class="btn btn-ghost" onclick="_propagationCancel()">✕</button>
    </div>
    <div style="font-size:13px;color:var(--t2);margin-bottom:14px">
      This group appears in <strong>${todayN}</strong> other scene${todayN===1?'':'s'} today
      and <strong>${otherN}</strong> on other days. Where do you want this edit applied?
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn btn-secondary" style="text-align:left" onclick="_propagationApply('this')">
        <strong>Just this scene</strong>
        <div style="font-size:11px;color:var(--tmut);margin-top:2px">Leave other scenes unchanged.</div>
      </button>
      <button class="btn btn-secondary" style="text-align:left" onclick="_propagationApply('today')" ${todayN===0?'disabled style="opacity:0.4;text-align:left"':''}>
        <strong>All scenes today (${todayN} other${todayN===1?'':'s'})</strong>
        <div style="font-size:11px;color:var(--tmut);margin-top:2px">Update every "${label}" group on Day ${peers.today[0]?.day.dayNumber ?? sc.dayNumber ?? ''}.</div>
      </button>
      <button class="btn btn-primary" style="text-align:left" onclick="_propagationApply('all')" ${totalN===0?'disabled style="opacity:0.4;text-align:left"':''}>
        <strong>All across the schedule (${totalN} other${totalN===1?'':'s'})</strong>
        <div style="font-size:11px;color:rgba(255,255,255,0.75);margin-top:2px">Update every "${label}" group everywhere.</div>
      </button>
    </div>
  `);
}

function _propagationApply(scope){
  const ctx=window._propagationCtx;
  if(!ctx) return;
  let peerList=[];
  if(scope==='today') peerList=ctx.peers.today;
  else if(scope==='all') peerList=ctx.peers.today.concat(ctx.peers.otherDays);
  _applyRoleSave(ctx.sc, ctx.newRole, peerList);
  delete window._propagationCtx;
}
function _propagationCancel(){
  delete window._propagationCtx;
  closeModal();
}

function saveDayStandin(dayId,siId){
  const name=document.getElementById('dsi-name').value.trim();
  if(!name){alert('Name required');return;}
  const day=state.days.find(d=>d.id===dayId);if(!day)return;
  if(!day.dayStandins) day.dayStandins=[];
  const si={
    id:siId||uid(),
    name,
    character:document.getElementById('dsi-char').value.trim(),
    rate:parseFloat(document.getElementById('dsi-rate').value)||(state.show.defaultRates?.standin||262),
    hours:Math.max(8,parseFloat(document.getElementById('dsi-hrs').value)||12)
  };
  day.dayStandins=day.dayStandins.filter(s=>s.id!==si.id);
  day.dayStandins.push(si);
  save();closeModal();render();
}

function deleteDayStandin(dayId,siId){
  const day=state.days.find(d=>d.id===dayId);if(!day)return;
  day.dayStandins=(day.dayStandins||[]).filter(s=>s.id!==siId);
  save();render();
}

function updateDaySIHours(dayId,siId,val){
  const day=state.days.find(d=>d.id===dayId);if(!day)return;
  const si=(day.dayStandins||[]).find(s=>s.id===siId);
  if(si) si.hours=Math.max(8,parseFloat(val)||8);
  save();
}

function _nowISO(){ return new Date().toISOString(); }

function _saveLabel(){
  const s=state.show;
  const parts=[];
  if(s.name) parts.push(s.name);
  if(s.episode) parts.push('Ep '+s.episode);
  return parts.join(' · ')||'Untitled';
}

// "Has substantive content" — board worth auto-saving before switching.
// Empty state (no days, no scenes, no roster, default show name) is skipped.
function _hasSubstance(){
  const days=state.days||[];
  if(days.some(d=>(d.scenes||[]).length>0 || (d.scenes||[]).some(sc=>(sc.roles||[]).length>0))) return true;
  if((state.standins||[]).length>0) return true;
  if(((state.boneyard)||[]).length>0) return true;
  if((state.show.name||'').trim() || (state.show.episode||'').trim()) return true;
  return false;
}

// Persist the current board to /saves under its current name (or a derived
// label). Used before switching to a different breakdown so nothing is lost.
// Resolves with the save id (existing or new), or null if there was nothing
// worth saving / the server is unreachable.
async function _autoSaveCurrent(){
  if(!_hasSubstance()) return null;
  const id=_saveId||Math.random().toString(36).slice(2,10);
  const name=_saveName||_saveLabel();
  const body={id, name, savedAt:_nowISO(), state};
  try{
    const res=await fetch('/saves',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await res.json();
    if(j.ok){ _saveId=id; _saveName=name; return id; }
  }catch(e){}
  return null;
}

async function newEpisode(){

async function loadSave(id){
  // If the current board has unsaved-ish content, persist it first so the
  // switch is non-destructive. _autoSaveCurrent is a no-op for empty boards
  // and silently fails closed if the server is unreachable.
  if(id !== _saveId){
    await _autoSaveCurrent();
  }
  try{
    const res=await fetch(`/saves/${id}`);
    const j=await res.json();
    if(!j.ok){ showToast('Load failed: '+(j.error||'unknown'),'error'); return; }
    state=j.state;
    _saveId=j.state._saveId||id;
    _saveName=j.state._saveName||'';
    // Migrate
    if(!state.show.isSeries) state.show.isSeries=false;
    if(!Array.isArray(state.boneyard)) state.boneyard=[];
    save(); expandedDays={}; closeModal(); render(); updateNavInfo();
    showToast(`Loaded: ${_saveName}`);
  }catch(e){ showToast('Load failed — is the server running?','error'); }
}

function fetchWithTimeout(url, opts, ms){
